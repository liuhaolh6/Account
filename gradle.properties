# Gradle 构建参数：开启并行与缓存以加快增量编译
# 注意：文件编码必须显式声明为 UTF-8，否则中文路径在 Windows 下会乱码，
# 导致测试工作进程无法加载测试类（ClassNotFoundException）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX 是现代 Android 项目的必需项
android.useAndroidX=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 只生成当前变体所需的 R 类，减少编译产物体积
android.nonTransitiveRClass=true

# 项目路径包含中文，AGP 默认会拒绝构建。经实测本机（Gradle 8.13 + AGP 8.11 + JDK 21）
# 中文路径可正常编译与打包，因此显式关闭该校验。
android.overridePathCheck=true

